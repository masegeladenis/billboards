<!doctype html>
<html lang="en">

    <head>
        
        <meta charset="utf-8" />
        <title>Login | Billboard Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Billboard Advertisement Management System" name="description" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Layout Js -->
        <script src="assets/js/layout.js"></script>
        <!-- Bootstrap Css -->
        <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
        <!-- Icons Css -->
        <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
        <!-- App Css-->
        <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />



    </head>

    <body>
        <div class="auth-maintenance d-flex align-items-center min-vh-100">
            <div class="bg-overlay bg-light"></div>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-10">
                        <div class="auth-full-page-content d-flex min-vh-100 py-sm-5 py-4">
                            <div class="w-100">
                                <div class="d-flex flex-column h-100 py-0 py-xl-3">
                                    <div class="text-center mb-4">
                                        <a href="index.html" class="">
                                            <img src="assets/images/logo-dark.png" alt="" height="22" class="auth-logo logo-dark mx-auto">
                                            <img src="assets/images/logo-light.png" alt="" height="22" class="auth-logo logo-light mx-auto">
                                        </a>
                                        <p class="text-muted mt-2">Billboard Advertisement Management System</p>
                                    </div>
    
                                    <div class="card my-auto overflow-hidden">
                                            <div class="row g-0">
                                                <div class="col-lg-6">
                                                    <div class="bg-overlay bg-primary"></div>
                                                    <div class="h-100 bg-auth align-items-end">
                                                    </div>
                                                </div>

                                                <div class="col-lg-6">
                                                    <div class="p-lg-5 p-4">
                                                        <div>
                                                            <div class="text-center mt-1">
                                                                <h4 class="font-size-18">Welcome Back !</h4>
                                                                <p class="text-muted">Sign in to manage your billboard advertisements.</p>
                                                            </div>

                                                            <div class="alert alert-danger d-none" id="loginAlert" role="alert"></div>

                                                            <form id="loginForm" class="auth-input">
                                                                <div class="mb-2">
                                                                    <label for="email" class="form-label">Email</label>
                                                                    <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label" for="password-input">Password</label>
                                                                    <input type="password" class="form-control" id="password-input" placeholder="Enter password" required>
                                                                </div>
                                                                <div class="form-check">
                                                                    <input class="form-check-input" type="checkbox" value="" id="auth-remember-check">
                                                                    <label class="form-check-label" for="auth-remember-check">Remember me</label>
                                                                </div>
                                                                <div class="mt-3">
                                                                    <button class="btn btn-primary w-100" type="submit" id="loginBtn">Sign In</button>
                                                                </div>
                                                            </form>
                                                        </div>
                                                    
                                                        <div class="mt-4 text-center">
                                                            <p class="mb-0">Don't have an account ? <a href="auth-register.html" class="fw-medium text-primary"> Register </a> </p>
                                                        </div>
                                                    </div>
                                                </div>  
                                        </div>
                                    </div>
                                    <!-- end card -->
                                    
                                    <div class="mt-5 text-center">
                                        <p class="mb-0">© <script>document.write(new Date().getFullYear())</script> Billboard Manager</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- end col -->
                </div>
                <!-- end row -->
            </div>
        </div>
        
        <!-- JAVASCRIPT -->
        <script src="assets/libs/jquery/jquery.min.js"></script>
        <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="assets/libs/metismenu/metisMenu.min.js"></script>
        <script src="assets/libs/simplebar/simplebar.min.js"></script>
        <script src="assets/libs/node-waves/waves.min.js"></script>

        <!-- Icon -->
        <script src="https://unicons.iconscout.com/release/v2.0.1/script/monochrome/bundle.js"></script>

        <script src="assets/js/app.js"></script>

        <script>
            // App root = everything before /public/DASH/ (works on XAMPP and Cloudways)
            const API_BASE = location.pathname.replace(/\/public\/DASH\/.*$/, '') + '/api';

            // Already signed in? Go straight to the dashboard.
            fetch(`${API_BASE}/auth.php?action=check`, { credentials: 'include' })
                .then(r => r.json())
                .then(d => { if (d.success) location.href = 'index.html'; })
                .catch(() => {});

            document.getElementById('loginForm').addEventListener('submit', async e => {
                e.preventDefault();
                const btn = document.getElementById('loginBtn');
                const alertBox = document.getElementById('loginAlert');
                alertBox.classList.add('d-none');
                btn.disabled = true;
                btn.textContent = 'Signing In…';

                try {
                    const res = await fetch(`${API_BASE}/auth.php`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: document.getElementById('email').value,
                            password: document.getElementById('password-input').value
                        })
                    });
                    const data = await res.json();

                    if (data.success) {
                        location.href = 'index.html';
                    } else {
                        alertBox.textContent = data.message || 'Incorrect email or password';
                        alertBox.classList.remove('d-none');
                    }
                } catch {
                    alertBox.textContent = 'Connection error. Please try again.';
                    alertBox.classList.remove('d-none');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            });
        </script>

    </body>
