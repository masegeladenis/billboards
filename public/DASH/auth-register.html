<!doctype html>
<html lang="en">

    <head>
        
        <meta charset="utf-8" />
        <title>Register | Billboard Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Billboard Advertisement Management System" name="description" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Layout Js -->
        <script src="assets/js/layout.js"></script>
        <!-- Bootstrap Css -->
        <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
        <!-- Icons Css -->
        <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
        <!-- App Css-->
        <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />



    </head>

    <body>
        <div class="auth-maintenance d-flex align-items-center min-vh-100">
            <div class="bg-overlay bg-light"></div>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-10">
                        <div class="auth-full-page-content d-flex min-vh-100 py-sm-5 py-4">
                            <div class="w-100">
                                <div class="d-flex flex-column h-100 py-0 py-xl-3">
                                    <div class="text-center mb-4">
                                        <a href="index.html" class="text-decoration-none">
                                            <h3 class="fw-bold text-dark mb-0">📢 Billboard Manager</h3>
                                        </a>
                                        <p class="text-muted mt-2">Billboard Advertisement Management System</p>
                                    </div>
    
                                    <div class="card my-auto overflow-hidden">
                                            <div class="row g-0">
                                                <div class="col-lg-6">
                                                    <div class="bg-overlay bg-primary"></div>
                                                    <div class="h-100 bg-auth align-items-end">
                                                    </div>
                                                </div>

                                                <div class="col-lg-6">
                                                    <div class="p-lg-5 p-4">
                                                        <div>
                                                            <div class="text-center mt-1">
                                                                <h4 class="font-size-18">Register account</h4>
                                                                <p class="text-muted">Create your Billboard Manager account.</p>
                                                            </div>

                                                            <div class="alert alert-danger d-none" id="registerAlert" role="alert"></div>

                                                            <form id="registerForm" class="auth-input">
                                                                <div class="mb-2">
                                                                    <label for="useremail" class="form-label">Email</label>
                                                                    <input type="email" class="form-control" id="useremail" placeholder="Enter email" required>
                                                                </div>

                                                                <div class="mb-2">
                                                                    <label for="username" class="form-label">Full Name</label>
                                                                    <input type="text" class="form-control" id="username" placeholder="Enter full name" required>
                                                                </div>

                                                                <div class="mb-2">
                                                                    <label for="companyname" class="form-label">Company <span class="text-muted">(optional)</span></label>
                                                                    <input type="text" class="form-control" id="companyname" placeholder="Enter company name">
                                                                </div>

                                                                <div class="mb-3">
                                                                    <label class="form-label" for="password-input">Password</label>
                                                                    <input type="password" class="form-control" id="password-input" placeholder="Enter password" required minlength="6">
                                                                </div>

                                                                <div class="mt-3">
                                                                    <button class="btn btn-primary w-100" type="submit" id="registerBtn">Register</button>
                                                                </div>
                                                              </form>
                                                        </div>
                                                    
                                                        <div class="mt-4 text-center">
                                                            <p class="mb-0">Already have an account ? <a href="auth-login.html" class="fw-medium text-primary"> Login</a> </p>
                                                        </div>
                                                    </div>
                                                </div>  
                                        </div>
                                    </div>
                                    <!-- end card -->
                                    
                                    <div class="mt-5 text-center">
                                        <p class="mb-0">© <script>document.write(new Date().getFullYear())</script> Billboard Manager</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- end col -->
                </div>
                <!-- end row -->
            </div>
        </div>

        <!-- JAVASCRIPT -->
        <script src="assets/libs/jquery/jquery.min.js"></script>
        <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="assets/libs/metismenu/metisMenu.min.js"></script>
        <script src="assets/libs/simplebar/simplebar.min.js"></script>
        <script src="assets/libs/node-waves/waves.min.js"></script>

        <!-- Icon -->
        <script src="https://unicons.iconscout.com/release/v2.0.1/script/monochrome/bundle.js"></script>

        <script src="assets/js/app.js"></script>

        <script>
            const API_BASE = location.pathname.replace(/\/public\/DASH\/.*$/, '') + '/api';

            document.getElementById('registerForm').addEventListener('submit', async e => {
                e.preventDefault();
                const btn = document.getElementById('registerBtn');
                const alertBox = document.getElementById('registerAlert');
                alertBox.classList.add('d-none');
                btn.disabled = true;
                btn.textContent = 'Creating account…';

                const email = document.getElementById('useremail').value;
                const password = document.getElementById('password-input').value;

                try {
                    const res = await fetch(`${API_BASE}/auth.php`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email,
                            password,
                            name: document.getElementById('username').value,
                            company_name: document.getElementById('companyname').value
                        })
                    });
                    const data = await res.json();

                    if (data.success) {
                        // Auto-login with the new credentials, then go to the dashboard
                        const login = await fetch(`${API_BASE}/auth.php`, {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        }).then(r => r.json());

                        location.href = login.success ? 'index.html' : 'auth-login.html';
                    } else {
                        alertBox.textContent = data.message || 'Registration failed';
                        alertBox.classList.remove('d-none');
                    }
                } catch {
                    alertBox.textContent = 'Connection error. Please try again.';
                    alertBox.classList.remove('d-none');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Register';
                }
            });
        </script>

    </body>
